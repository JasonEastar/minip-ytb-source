name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate version
        id: version
        run: |
          DATE_TAG=$(date -u +'%Y.%m.%d')
          TAG="v${DATE_TAG}-${{ github.run_number }}"
          VERSION="${DATE_TAG}.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Patch manifest version
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.version }}';
            m.bundleUrl = 'https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/youtube.bundle.js';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          cat manifest.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      # Gate: bundle must load like the app loads it and match the manifest.
      - name: Test
        run: npm test

      - name: Add bundle hash to manifest
        id: hash
        run: |
          SHA=$(sha256sum dist/youtube.bundle.js | cut -d' ' -f1)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.bundleSha256 = '${SHA}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          cat manifest.json

      - name: Copy manifest to dist
        run: cp manifest.json dist/manifest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Auto-built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            **Bundle:**
            ```
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/youtube.bundle.js
            ```

            **Manifest:**
            ```
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/manifest.json
            ```

            **WebView runtime (ship inside the app):**
            ```
            https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/youtube-po-token.json
            ```

            **Bundle SHA-256:** `${{ steps.hash.outputs.sha }}`
          files: |
            dist/youtube.bundle.js
            dist/manifest.json
            dist/youtube-po-token.json
          make_latest: true
          fail_on_unmatched_files: true
